<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>beatdeck</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light dark;--pink:#f6b8c6;--pink-bold:#e8698a;--mint:#a8e6cf;--bg:#0b0b0f;--surface:rgba(255,255,255,.06);--surface-2:rgba(255,255,255,.11);--border:rgba(255,255,255,.14);--text:#f2f2f5;--muted:#9a9aa6}
  @media (prefers-color-scheme:light){:root{--bg:#f3f0f2;--surface:rgba(255,255,255,.55);--surface-2:rgba(255,255,255,.8);--border:rgba(0,0,0,.1);--text:#17171c;--muted:#6b6b76}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:Geist,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;
    background-image:radial-gradient(60vw 60vw at 80% -10%,color-mix(in srgb,var(--pink-bold) 30%,transparent),transparent 70%),radial-gradient(50vw 50vw at -10% 100%,color-mix(in srgb,var(--mint) 25%,transparent),transparent 70%);background-attachment:fixed}
  main{max-width:520px;margin:0 auto;padding:24px 16px calc(220px + env(safe-area-inset-bottom))}
  h1{font-size:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 4px 16px}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;border-radius:24px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(14px);cursor:pointer;transition:background .15s,transform .1s}
  li:active{transform:scale(.985)}
  li.on{background:var(--surface-2);border-color:var(--pink-bold);box-shadow:0 0 0 3px color-mix(in srgb,var(--pink-bold) 25%,transparent)}
  .th{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2);border:1px solid var(--border)}
  li.on .th{outline:2px solid var(--pink-bold);outline-offset:2px}
  .m{min-width:0;flex:1}
  .t{font-size:14px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .s{font-size:12px;color:var(--muted);margin-top:3px;font-family:"Geist Mono",monospace}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;align-items:center;
    background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(24px);border-top:1px solid var(--border)}
  .now{font-size:12px;color:var(--muted);max-width:520px;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:"Geist Mono",monospace}
  .row{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;max-width:520px}
  button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(14px);border-radius:999px;cursor:pointer;transition:background .15s,transform .1s}
  button:active{transform:scale(.94)}
  .c{width:64px;height:64px;font-size:22px;display:grid;place-items:center}
  .c.big{width:84px;height:84px;background:var(--pink-bold);color:#fff;border-color:transparent;font-size:28px}
  .v{flex:1;height:44px;font-size:14px;font-family:"Geist Mono",monospace}
  .v.on{background:var(--mint);color:#0b0b0f;border-color:transparent;font-weight:600}
  .prog{width:100%;max-width:520px;height:3px;border-radius:2px;background:var(--border);overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:var(--pink-bold);transition:width 1s linear}
</style>
</head>
<body>
<main>
  <h1>beatdeck · no vocals</h1>
  <ul id="list"></ul>
</main>
<div class="bar">
  <div class="prog"><i id="prog"></i></div>
  <div class="now" id="now">…</div>
  <div class="row">
    <button class="c" data-a="prev" aria-label="previous">⏮</button>
    <button class="c big" id="pp" data-a="toggle" aria-label="play/pause">▶</button>
    <button class="c" data-a="next" aria-label="next">⏭</button>
  </div>
  <div class="row" id="vols">
    <button class="v" data-v="25">25</button>
    <button class="v" data-v="50">50</button>
    <button class="v" data-v="75">75</button>
    <button class="v" data-v="100">100</button>
  </div>
</div>
<script type="module">
const $ = s => document.querySelector(s)
const api = (p, q = '') => fetch(`/api/${p}${q}`).then(r => r.json())
const songs = await api('songs')
let cur = -1, vol = null

$('#list').innerHTML = songs.map((s, i) => `
  <li data-i="${i}">
    <img class="th" src="https://i.ytimg.com/vi/${s.id}/mqdefault.jpg" alt="" loading="lazy">
    <div class="m"><div class="t">${s.t}</div><div class="s">${s.ch} · ${s.len}</div></div>
  </li>`).join('')

const fmt = n => { n = Math.floor(n || 0); const h = n / 3600 | 0, m = (n % 3600) / 60 | 0, s = n % 60; return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(s).padStart(2, '0') }

const paint = st => {
  if (st.cur !== cur) { cur = st.cur; document.querySelectorAll('li').forEach((l, i) => l.classList.toggle('on', i === cur)) }
  $('#pp').textContent = st.paused ? '▶' : '⏸'
  $('#now').textContent = songs[cur] ? `${st.paused ? 'paused' : 'playing'} · ${fmt(st.t)} / ${fmt(st.d)} · ${songs[cur].t}` : 'nothing on'
  $('#prog').style.width = st.d ? (st.t / st.d * 100) + '%' : '0'
  if (st.vol !== vol) { vol = st.vol; document.querySelectorAll('.v').forEach(b => b.classList.toggle('on', +b.dataset.v === vol)) }
}

const refresh = () => api('status').then(paint).catch(() => { })
refresh(); setInterval(refresh, 2000)

document.addEventListener('click', async e => {
  const li = e.target.closest('li'); if (li) { await api('play', `?i=${li.dataset.i}`); li.classList.add('on'); setTimeout(refresh, 1500); return }
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.a) await api(b.dataset.a)
  if (b.dataset.v) await api('vol', `?v=${b.dataset.v}`)
  setTimeout(refresh, b.dataset.a === 'toggle' || b.dataset.v ? 300 : 1500)
})
</script>
</body>
</html>
