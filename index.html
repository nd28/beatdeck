<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>beatdeck</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light dark;--pink:#f6b8c6;--pink-bold:#e8698a;--mint:#a8e6cf;--bg:#0b0b0f;--surface:rgba(255,255,255,.06);--surface-2:rgba(255,255,255,.11);--border:rgba(255,255,255,.14);--text:#f2f2f5;--muted:#9a9aa6}
  @media (prefers-color-scheme:light){:root{--bg:#f3f0f2;--surface:rgba(255,255,255,.55);--surface-2:rgba(255,255,255,.8);--border:rgba(0,0,0,.1);--text:#17171c;--muted:#6b6b76}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:Geist,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;
    background-image:radial-gradient(60vw 60vw at 80% -10%,color-mix(in srgb,var(--pink-bold) 30%,transparent),transparent 70%),radial-gradient(50vw 50vw at -10% 100%,color-mix(in srgb,var(--mint) 25%,transparent),transparent 70%);background-attachment:fixed}
  main{max-width:520px;margin:0 auto;padding:24px 16px calc(110px + env(safe-area-inset-bottom))}
  h1{font-size:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 4px 16px;display:flex;align-items:baseline;gap:10px}
  .ver{font-size:11px;letter-spacing:0;text-transform:none;font-family:"Geist Mono",monospace;color:var(--muted);opacity:.6;margin-left:auto}
  #list{display:flex;flex-direction:column;gap:20px}
  .gh{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 16px}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;border-radius:24px;background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(14px);cursor:pointer;transition:background .15s,transform .1s}
  li:active{transform:scale(.985)}
  li.on{background:var(--surface-2);border-color:var(--pink-bold);box-shadow:0 0 0 3px color-mix(in srgb,var(--pink-bold) 25%,transparent)}
  .th{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2);border:1px solid var(--border)}
  li.on .th{outline:2px solid var(--pink-bold);outline-offset:2px}
  .m{min-width:0;flex:1}
  .t{font-size:14px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .s{font-size:12px;color:var(--muted);margin-top:3px;font-family:"Geist Mono",monospace}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;align-items:center;
    background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(24px);border-top:1px solid var(--border)}
  /* dock: a pill that grows into the deck */
  .dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(520px,calc(100% - 24px));
    border-radius:40px;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);
    box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden;transition:border-radius .3s,box-shadow .3s}
  .dock.open{border-radius:28px;box-shadow:0 16px 60px rgba(0,0,0,.4),0 0 0 3px color-mix(in srgb,var(--pink-bold) 20%,transparent)}
  .pill{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;cursor:pointer;user-select:none;position:relative}
  .pth{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2);border:1px solid var(--border);transition:transform .3s}
  .dock.open .pth{transform:scale(1.08)}
  .pill.live .pth{animation:spin 12s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pm{min-width:0;flex:1}
  .pt{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ps{font-size:11px;color:var(--muted);font-family:"Geist Mono",monospace;margin-top:2px}
  .mini{width:44px;height:44px;flex:none;font-size:16px;display:grid;place-items:center;background:var(--pink-bold);color:#fff;border-color:transparent}
  .pprog{position:absolute;left:68px;right:64px;bottom:0;height:2px;background:var(--border)}
  .pprog i{display:block;height:100%;width:0;background:var(--pink-bold);transition:width 1s linear}
  .dock.open .pprog{opacity:0}
  .deck{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}
  .dock.open .deck{grid-template-rows:1fr}
  .deck>div{overflow:hidden;min-height:0}
  .deck .in{padding:6px 14px 16px;display:flex;flex-direction:column;gap:14px;align-items:center}
  .row{display:flex;gap:10px;align-items:center;justify-content:center;width:100%}
  button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:999px;cursor:pointer;transition:background .15s,transform .1s}
  button:active{transform:scale(.94)}
  .c{width:60px;height:60px;font-size:22px;display:grid;place-items:center}
  .c.big{width:76px;height:76px;background:var(--pink-bold);color:#fff;border-color:transparent;font-size:26px}
  .v{flex:1;height:42px;font-size:14px;font-family:"Geist Mono",monospace}
  .v.on{background:var(--mint);color:#0b0b0f;border-color:transparent;font-weight:600}
  .prog{width:100%;height:3px;border-radius:2px;background:var(--border);overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:var(--pink-bold);transition:width 1s linear}
  .tm{display:flex;justify-content:space-between;width:100%;font-size:11px;color:var(--muted);font-family:"Geist Mono",monospace;margin-top:-8px}
  /* server chip in the header + picker dialog */
  .srv{font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:var(--text);max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srv.off{border-color:var(--pink-bold);color:var(--pink-bold)}
  dialog{border:1px solid var(--border);border-radius:24px;padding:0;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:var(--text);width:min(420px,calc(100% - 32px));box-shadow:0 16px 60px rgba(0,0,0,.4)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog form{padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px}
  dialog h2{margin:0 0 2px 4px;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  #slist{gap:6px}
  #slist li{padding:10px 8px 10px 14px;border-radius:18px;gap:10px}
  #slist .m{display:flex;flex-direction:column;gap:2px}
  #slist .t{font-size:13px;-webkit-line-clamp:1}
  #slist .s{margin:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #slist .x{width:32px;height:32px;font-size:14px;display:grid;place-items:center;color:var(--muted);flex:none}
  #slist .empty{padding:10px 14px;font-size:12px;color:var(--muted);cursor:default}
  .add{display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px solid var(--border)}
  .add input{font:inherit;font-size:14px;padding:10px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);width:100%;outline:none}
  .add input:focus{border-color:var(--pink-bold)}
  .add .row{justify-content:flex-end}
  .add .row button{padding:9px 16px;font-size:13px}
  .add .row .go{background:var(--pink-bold);color:#fff;border-color:transparent}
  .hint{margin:0 4px;font-size:11px;line-height:1.5;color:var(--muted)}
  .hint code{font-family:"Geist Mono",monospace}
  @media (prefers-reduced-motion:reduce){.pill.live .pth{animation:none}.dock,.deck,.pth{transition:none}}
</style>
</head>
<body>
<main>
  <h1>beatdeck <button class="srv" id="srv" aria-label="choose server">…</button><span class="ver">v%APP_VERSION%</span></h1>
  <div id="list"></div>
</main>
<dialog id="sdlg">
  <form method="dialog">
    <h2>servers</h2>
    <ul id="slist"></ul>
    <div class="add">
      <input id="sname" placeholder="name (macbook)" autocomplete="off" autocapitalize="off">
      <input id="surl" placeholder="https://macbook.tailnet.ts.net" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row"><button type="submit">close</button><button type="button" class="go" id="sadd">add</button></div>
    </div>
    <p class="hint">each machine runs <code>npm start</code>; on tailscale expose it with <code>tailscale serve --bg 5180</code> and use the https <code>*.ts.net</code> address here. this page is https, so plain <code>http://</code> targets are blocked by the browser.</p>
  </form>
</dialog>
<div class="dock" id="dock">
  <div class="pill" id="pill" role="button" aria-expanded="false" aria-label="open controls">
    <img class="pth" id="pth" alt="">
    <div class="pm"><div class="pt" id="pt">nothing on</div><div class="ps" id="ps">…</div></div>
    <button class="mini" data-a="toggle" data-pp aria-label="play/pause">▶</button>
    <div class="pprog"><i data-prog></i></div>
  </div>
  <div class="deck"><div><div class="in">
    <div class="prog"><i data-prog></i></div>
    <div class="tm"><span id="t0">0:00</span><span id="t1">0:00</span></div>
    <div class="row">
      <button class="c" data-a="prev" aria-label="previous">⏮</button>
      <button class="c big" data-a="toggle" data-pp aria-label="play/pause">▶</button>
      <button class="c" data-a="next" aria-label="next">⏭</button>
    </div>
    <div class="row" id="vols">
      <button class="v" data-v="25">25</button>
      <button class="v" data-v="50">50</button>
      <button class="v" data-v="75">75</button>
      <button class="v" data-v="100">100</button>
    </div>
  </div></div></div>
</div>
<script type="module">
const $ = s => document.querySelector(s)

// which machine to drive. '' = the origin this page came from (only true when a
// laptop serves the page itself); otherwise an absolute url of another beatdeck.
// remembered per browser in localStorage.
const local = import.meta.env.BASE_URL === '/'                     // pages build has base /beatdeck/, so no api here
const servers = JSON.parse(localStorage.getItem('beatdeck.servers') || '[]')   // [{name,url}]
let base = localStorage.getItem('beatdeck.server') ?? (local ? '' : servers[0]?.url ?? null)
const srvName = u => u === '' ? 'this host' : (servers.find(s => s.url === u)?.name || u?.replace(/^https?:\/\//, '') || 'no server')
const api = (p, q = '') => fetch(`${base ?? ''}/api/${p}${q}`).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))

const sdlg = $('#sdlg'), slist = $('#slist')
const save = () => { localStorage.setItem('beatdeck.servers', JSON.stringify(servers)); if (base !== null) localStorage.setItem('beatdeck.server', base) }
const use = u => { base = u; save(); location.reload() }         // switching = fresh page against the new host, simplest correct thing
const drawServers = () => {
  const rows = [...(local ? [{ name: 'this host', url: '' }] : []), ...servers]
  slist.innerHTML = rows.length ? rows.map(s => `
    <li data-u="${s.url}" class="${s.url === base ? 'on' : ''}">
      <div class="m"><div class="t">${s.name}</div><div class="s">${s.url || location.origin}</div></div>
      ${s.url ? `<button type="button" class="x" data-rm="${s.url}" aria-label="remove ${s.name}">✕</button>` : ''}
    </li>`).join('') : '<li class="empty">no servers yet — add one below</li>'
}
$('#srv').onclick = () => { drawServers(); sdlg.showModal() }
$('#sadd').onclick = () => {
  const url = $('#surl').value.trim().replace(/\/+$/, ''), name = $('#sname').value.trim() || url.replace(/^https?:\/\//, '')
  if (!/^https?:\/\/\S+$/.test(url)) return $('#surl').focus()
  const i = servers.findIndex(s => s.url === url)
  i >= 0 ? servers[i].name = name : servers.push({ name, url })
  use(url)
}
slist.onclick = e => {
  const rm = e.target.closest('[data-rm]')
  if (rm) { servers.splice(servers.findIndex(s => s.url === rm.dataset.rm), 1); save(); if (base === rm.dataset.rm) { localStorage.removeItem('beatdeck.server'); location.reload() } return drawServers() }
  const li = e.target.closest('li[data-u]')
  if (li && li.dataset.u !== base) use(li.dataset.u)
}

$('#srv').textContent = srvName(base)
let songs = []
try { songs = await api('songs') }
catch {
  $('#srv').classList.add('off')
  $('#pt').textContent = base === null ? 'pick a server' : `can't reach ${srvName(base)}`
  $('#ps').textContent = base === null ? 'tap the chip in the header' : base || location.origin
  drawServers(); sdlg.showModal()
}
let cur = -1, vol = null

const groups = []                                    // group by `g`, keep first-seen order
songs.forEach((s, i) => {
  let g = groups.find(x => x.name === (s.g || ''))
  if (!g) groups.push(g = { name: s.g || '', rows: [] })
  g.rows.push([s, i])
})

$('#list').innerHTML = groups.map(g => `
  <section>
    ${g.name ? `<h2 class="gh">${g.name}</h2>` : ''}
    <ul>${g.rows.map(([s, i]) => `
      <li data-i="${i}">
        <img class="th" src="https://i.ytimg.com/vi/${s.id}/mqdefault.jpg" alt="" loading="lazy">
        <div class="m"><div class="t">${s.t}</div><div class="s">${s.ch} · ${s.len}</div></div>
      </li>`).join('')}</ul>
  </section>`).join('')

const fmt = n => { n = Math.floor(n || 0); const h = n / 3600 | 0, m = (n % 3600) / 60 | 0, s = n % 60; return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(s).padStart(2, '0') }
const secs = len => (len || '').split(':').reduce((a, b) => a * 60 + +b, 0)

let st = { paused: true, t: 0, d: 0, cur: -1, vol: null }   // last painted state
let hold = 0                                                 // polls don't overwrite the UI until this time

const paint = s => {
  st = s
  if (st.cur !== cur) {
    cur = st.cur
    document.querySelectorAll('li[data-i]').forEach(l => l.classList.toggle('on', +l.dataset.i === cur))
    if (songs[cur]) { $('#pth').src = `https://i.ytimg.com/vi/${songs[cur].id}/mqdefault.jpg`; $('#pt').textContent = songs[cur].t }
  }
  document.querySelectorAll('[data-pp]').forEach(b => b.textContent = st.paused ? '▶' : '⏸')
  $('#pill').classList.toggle('live', !st.paused && !!songs[cur])
  $('#ps').textContent = songs[cur] ? `${st.paused ? 'paused' : 'playing'} · ${fmt(st.t)} / ${fmt(st.d)} · ${songs[cur].ch}` : '…'
  $('#t0').textContent = fmt(st.t); $('#t1').textContent = fmt(st.d)
  document.querySelectorAll('[data-prog]').forEach(p => p.style.width = st.d ? (st.t / st.d * 100) + '%' : '0')
  if (st.vol !== vol) { vol = st.vol; document.querySelectorAll('.v').forEach(b => b.classList.toggle('on', +b.dataset.v === vol)) }
}

const refresh = () => api('status').then(s => {
  if (Date.now() < hold) return
  if (!s.d && s.cur === st.cur) s.d = st.d              // video still loading: keep the length we already know
  paint(s)
}).catch(() => { })
if (songs.length) { refresh(); setInterval(refresh, 2000) }   // unreachable server: don't hammer it, the dialog is already up

// paint the expected outcome now, send the request, then let real state back in.
// `settle` is how long after the response the server still needs (play waits 4s before hitting video.play()).
const act = async (patch, req, settle = 0) => {
  hold = Infinity
  paint({ ...st, ...patch })
  try { await req() } catch { settle = 0 }
  hold = Date.now() + settle
  setTimeout(refresh, settle + 200)
}
const jump = i => {
  const n = (i + songs.length) % songs.length
  return act({ cur: n, paused: false, t: 0, d: secs(songs[n].len) }, () => api('play', `?i=${n}`), 5000)
}

const dock = $('#dock'), pill = $('#pill')
const setOpen = o => { dock.classList.toggle('open', o); pill.setAttribute('aria-expanded', o) }

document.addEventListener('click', e => {
  const b = e.target.closest('button')
  if (b && dock.contains(b)) {                       // any control in the dock: act, stay as-is
    const a = b.dataset.a
    if (a === 'toggle') act({ paused: !st.paused }, () => api('toggle'))
    if (a === 'prev') jump(st.cur - 1)
    if (a === 'next') jump(st.cur + 1)
    if (b.dataset.v) act({ vol: +b.dataset.v }, () => api('vol', `?v=${b.dataset.v}`))
    return
  }
  if (pill.contains(e.target)) return setOpen(!dock.classList.contains('open'))   // pill body toggles the deck
  if (dock.contains(e.target)) return                                             // tap on deck padding: keep open
  setOpen(false)                                                                  // outside: shrink to pill
  const li = e.target.closest('li[data-i]')
  if (li) jump(+li.dataset.i)
})
document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false) })
</script>
</body>
</html>
